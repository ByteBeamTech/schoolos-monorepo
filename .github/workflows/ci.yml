name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: "Backend — typecheck + lint + tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test --passWithNoTests --forceExit --ci
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/schoolos_test
          JWT_SECRET: ci-test-secret-minimum-32-characters-x
          SUPERADMIN_JWT_SECRET: ci-superadmin-secret-minimum-32-chars
          REDIS_URL: redis://localhost:6379
      # Dependency vulnerability scan — fails on high/critical CVEs
      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true   # warn on violations, do not block (remove when baseline is clean)

  # ── Prisma schema validation ───────────────────────────────────────────────
  prisma-validate:
    name: "Prisma schema"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Validate schema
        run: pnpm exec prisma validate

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: "Frontend — typecheck + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm tsc --noEmit
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          SKIP_ENV_VALIDATION: "true"

  # ── Superadmin ─────────────────────────────────────────────────────────────
  superadmin:
    name: "Superadmin — typecheck + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superadmin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm tsc --noEmit
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          SKIP_ENV_VALIDATION: "true"
